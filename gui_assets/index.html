<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>UU Link</title><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/vendor/magpie.css"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script><script src="/setup.js" defer></script></head>
<body class="window">
<aside class="sidebar" id="side" hidden><div class="side-top"></div><div class="side-scroll"></div><div class="side-foot"><button class="icon" id="side-prefs" data-view="settings"><span class="uu-glyph" data-icon="settings" aria-hidden="true"></span><span class="side-l">设置</span></button></div><div class="side-edge" id="sideEdge" role="separator" aria-label="调整侧栏宽度" aria-orientation="vertical" tabindex="0" aria-valuemin="212" aria-valuemax="280" aria-valuenow="212"></div></aside>
<header class="top" id="top"><button class="icon side-toggle" id="sideToggle" title="切换侧栏" aria-label="切换侧栏"><span class="uu-glyph" data-icon="sidebar" aria-hidden="true"></span></button><div class="brand" id="brand"><span class="logo uu-glyph" data-icon="link" aria-hidden="true"></span><span>UU Link</span></div><h1 class="sr-only" id="page-title">连接</h1><div class="crumb" id="crumb" hidden></div>
<nav class="seg" id="nav" aria-label="主导航"><span class="thumb" aria-hidden="true"></span><button data-view="overview" class="on" aria-current="page"><span class="uu-glyph nav-ic" data-icon="link" aria-hidden="true"></span><span>连接</span></button><button data-view="devices"><span class="uu-glyph nav-ic" data-icon="devices" aria-hidden="true"></span><span>设备</span><em id="device-count"></em></button><button data-view="mappings"><span class="uu-glyph nav-ic" data-icon="mapping" aria-hidden="true"></span><span>映射</span><em id="mapping-count"></em></button><button data-view="logs"><span class="uu-glyph nav-ic" data-icon="logs" aria-hidden="true"></span><span>日志</span></button></nav>
<div class="actions"><button class="icon" id="refresh" aria-label="刷新状态" title="刷新状态"><span class="uu-glyph" data-icon="refresh" aria-hidden="true"></span></button><button class="icon" id="toolbar-settings" data-view="settings" aria-label="设置" title="设置"><span class="uu-glyph" data-icon="settings" aria-hidden="true"></span></button></div></header>
<div id="panel-error" class="uu-alert" role="status" hidden></div>
<main class="view" id="main" tabindex="-1"><div class="uu-loading"><span class="uu-spinner"></span>正在读取本机状态…</div></main>

<div id="toast" class="status lift" role="status" aria-live="polite" hidden></div>
<dialog id="modal" class="uu-dialog" aria-labelledby="modal-title"><div class="uu-dialog-head"><div><span class="label" id="modal-eyebrow">UU LINK</span><h2 id="modal-title"></h2></div><button class="icon" id="modal-close" aria-label="关闭对话框" title="关闭"><span class="uu-glyph" data-icon="close" aria-hidden="true"></span></button></div><div id="modal-body" class="uu-form-body"></div></dialog>
</body></html>
